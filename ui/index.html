<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   JARVIS HUD - ek hi file (CSS + JS). Python (pywebview) window.jarvis
   ke functions bulata hai; command box window.pywebview.api.ask() bulata hai.
   ===================================================================== */
:root {
  --bg: #020a14;
  --blue: #1fa9ff;
  --cyan: #8fe3ff;
  --deep: #0e4a72;
  --text: #cfeeff;
  --amber: #ffb03a;
  --fail: #ff5d6c;
  --panel: rgba(8, 36, 62, 0.42);
  --line: rgba(31, 169, 255, 0.32);
  --glow: rgba(31, 169, 255, 0.55);
  --cut: 14px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Chakra Petch", "Segoe UI", sans-serif;
  overflow: hidden;
  user-select: none;
}

/* ---------- Background: grid + beech mein glow ---------- */
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(31,169,255,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(31,169,255,0.07) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse at 50% 45%, #000 30%, transparent 85%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 30%, transparent 85%);
}
.bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 44%, rgba(31,169,255,0.18), transparent 42%),
              radial-gradient(circle at 50% 44%, rgba(14,74,114,0.35), transparent 70%);
}
.vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none; box-shadow: inset 0 0 200px 60px #000; }

/* ---------- Layout ---------- */
.hud {
  position: relative; z-index: 2; height: 100vh;
  display: grid;
  grid-template-rows: 64px 1fr 104px;
  grid-template-columns: minmax(260px, 330px) 1fr minmax(270px, 350px);
  grid-template-areas: "top top top" "left center right" "dock dock dock";
  gap: 14px; padding: 14px 20px;
  transition: filter 0.9s ease, opacity 0.9s ease;
}
.topbar { grid-area: top; }
.col-left { grid-area: left; }
.center { grid-area: center; }
.col-right { grid-area: right; }
.dock { grid-area: dock; }
.col-left, .col-right { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

/* ---------- Panel (kate kone + upar-left glowing line) ---------- */
.panel {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 14px 16px 16px;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.panel::before {
  content: ""; position: absolute; left: calc(var(--cut) + 4px); top: 0; width: 46px; height: 2px;
  background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
}
.panel h3 {
  margin: 0 0 12px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.24em;
  color: var(--blue); text-transform: uppercase; display: flex; justify-content: space-between;
}
.panel h3 small { color: rgba(143,227,255,0.55); font-weight: 500; letter-spacing: 0.12em; }

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; gap: 22px; }
.brand {
  font-size: 1.7rem; font-weight: 700; letter-spacing: 0.38em; color: var(--cyan);
  text-shadow: 0 0 12px var(--glow), 0 0 34px var(--glow);
  white-space: nowrap;
}
.pill {
  display: inline-flex; align-items: center; gap: 9px; padding: 5px 16px 5px 12px;
  border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 0.95rem;
  letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
}
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 10px var(--blue); animation: blink 1.4s infinite; }
body[data-state="thinking"] .pill .dot { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
body[data-state="thinking"] .pill { color: var(--amber); border-color: rgba(255,176,58,0.45); }
body[data-state="sleeping"] .pill .dot { background: var(--deep); box-shadow: none; animation: none; }
@keyframes blink { 50% { opacity: 0.3; } }
.ruler { flex: 1; height: 16px; min-width: 60px; position: relative; overflow: hidden; }
.ruler::before {
  content: ""; position: absolute; left: 0; right: 0;
  background: repeating-linear-gradient(90deg, rgba(31,169,255,0.55) 0 1px, transparent 1px 10px);
  mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
  height: 7px; top: 5px;
}
.ruler::after {
  content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 1px; background: rgba(31,169,255,0.35);
}
.online { font-size: 0.85rem; letter-spacing: 0.22em; color: var(--cyan); white-space: nowrap; }
.online b { color: var(--blue); }

/* ---------- Clock panel ---------- */
.clock-wrap { display: flex; align-items: center; gap: 16px; }
.date-ring { width: 92px; height: 92px; flex: none; }
.date-ring .num { font-size: 28px; font-weight: 700; fill: var(--cyan); }
.date-ring .mon { font-size: 11px; font-weight: 600; fill: var(--blue); letter-spacing: 3px; }
.time { font-size: 2.5rem; font-weight: 700; color: var(--cyan); line-height: 1; text-shadow: 0 0 14px var(--glow); }
.time small { font-size: 1.1rem; color: var(--blue); margin-left: 4px; }
.fulldate { margin-top: 6px; font-size: 0.92rem; opacity: 0.75; }

/* ---------- System gauges ---------- */
.gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
.gauge svg { width: 100%; max-width: 86px; height: auto; }
.gauge .val { font-size: 17px; font-weight: 700; fill: var(--cyan); }
.gauge .lbl { font-size: 0.72rem; letter-spacing: 0.18em; color: var(--blue); margin-top: 2px; }
.bars { margin-top: 12px; display: grid; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 44px 1fr 74px; align-items: center; gap: 8px; font-size: 0.8rem; }
.bar-row span:first-child { letter-spacing: 0.14em; color: var(--blue); }
.bar-row span:last-child { text-align: right; color: var(--cyan); font-weight: 600; }
.segs { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; height: 8px; }
.segs i { background: rgba(31,169,255,0.12); transition: background 0.4s; }
.segs i.on { background: var(--blue); box-shadow: 0 0 5px var(--blue); }

/* ---------- Activity ---------- */
.activity { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.acts { list-style: none; margin: 0; padding: 0; overflow: hidden; flex: 1; }
.acts li {
  display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: start;
  padding: 7px 0; border-bottom: 1px dashed rgba(31,169,255,0.16); font-size: 0.88rem;
  animation: fadein 0.35s ease;
}
.acts li > div { min-width: 0; }
.acts .st { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--blue); }
.acts .running .st { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blink 0.8s infinite; }
.acts .failed .st { background: var(--fail); box-shadow: 0 0 6px var(--fail); }
.acts .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acts .d { opacity: 0.6; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acts .tag { font-size: 0.68rem; letter-spacing: 0.14em; color: var(--blue); margin-top: 3px; }
.acts .running .tag { color: var(--cyan); }
.acts .failed .tag { color: var(--fail); }
.acts .empty { display: block; border: 0; opacity: 0.4; font-size: 0.85rem; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }

/* ---------- Center dial ---------- */
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; min-width: 0; }
.dial {
  position: relative;
  width: min(56vh, 44vw, 620px); aspect-ratio: 1;
  flex: none;
}
.dial svg, .dial canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.dial svg .spin { transform-box: view-box; transform-origin: 300px 300px; }
.r-cw-slow   { animation: spin 90s linear infinite; }
.r-ccw       { animation: spin 40s linear infinite reverse; }
.r-cw        { animation: spin 22s linear infinite; }
.r-ccw-fast  { animation: spin 12s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
body[data-state="thinking"] .r-cw, body[data-state="thinking"] .r-ccw-fast { animation-duration: 5s; }
.dial-core { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.dial-core .name {
  font-size: clamp(1.6rem, 3.6vh, 2.6rem); font-weight: 700; letter-spacing: 0.3em; margin-left: 0.3em;
  color: var(--cyan); text-shadow: 0 0 14px var(--glow), 0 0 40px var(--glow);
}
.dial-core .state { margin-top: 6px; font-size: 0.85rem; letter-spacing: 0.3em; color: var(--blue); text-transform: uppercase; }
body[data-state="thinking"] .dial-core .state { color: var(--amber); }

.caption {
  margin-top: 16px; max-width: min(820px, 100%); min-height: 3.2em; text-align: center;
  font-size: clamp(1.05rem, 2.2vh, 1.35rem); line-height: 1.5; font-weight: 500;
}
.caption .user { color: var(--amber); }
.caption .cursor { display: inline-block; width: 0.5em; height: 1em; margin-left: 2px; vertical-align: -0.12em; background: var(--cyan); animation: blink 0.9s infinite; }
.note { margin-top: 6px; min-height: 1.3em; font-size: 0.85rem; letter-spacing: 0.14em; color: rgba(143,227,255,0.6); text-transform: uppercase; }

/* ---------- Weather ---------- */
.weather { display: flex; align-items: center; gap: 16px; }
.weather svg { width: 104px; height: 104px; flex: none; }
.weather .temp { font-size: 30px; font-weight: 700; fill: var(--cyan); }
.weather .unit { font-size: 11px; fill: var(--blue); letter-spacing: 2px; }
.weather .city { font-size: 1.25rem; font-weight: 700; color: var(--cyan); }
.weather .desc { opacity: 0.75; margin-top: 2px; }
.weather .upd { margin-top: 6px; font-size: 0.72rem; letter-spacing: 0.14em; color: var(--blue); }

/* ---------- Conversation ---------- */
.convo { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--deep) transparent; user-select: text; }
.msg { margin-bottom: 10px; font-size: 0.95rem; line-height: 1.4; animation: fadein 0.3s ease; }
.msg b { display: block; font-size: 0.66rem; letter-spacing: 0.22em; margin-bottom: 1px; }
.msg.ai b { color: var(--blue); }
.msg.user b { color: var(--amber); }
.msg.user span { color: var(--amber); }

/* ---------- Dock ---------- */
.dock { display: flex; align-items: center; justify-content: center; gap: 14px; padding-bottom: 14px; }
.dock-btns { display: flex; gap: 14px; }
.btn {
  width: 58px; height: 58px; border-radius: 50%; flex: none;
  border: 1px solid var(--line); background: radial-gradient(circle, rgba(31,169,255,0.18), rgba(8,36,62,0.6) 70%);
  color: var(--cyan); display: grid; place-items: center; cursor: pointer; position: relative;
  box-shadow: 0 0 14px rgba(31,169,255,0.25), inset 0 0 12px rgba(31,169,255,0.2);
  transition: transform 0.15s, box-shadow 0.2s;
}
.btn:hover { box-shadow: 0 0 22px rgba(31,169,255,0.6), inset 0 0 14px rgba(31,169,255,0.35); transform: translateY(-2px); }
.btn:active { transform: scale(0.94); }
.btn svg { width: 24px; height: 24px; }
/* STOP button: bologe-bolte rokne ke liye (awaz + Esc dono ka backup) */
.btn.stop {
  color: var(--amber);
  border-color: rgba(255,178,71,0.55);
  background: radial-gradient(circle, rgba(255,140,60,0.2), rgba(60,26,8,0.6) 70%);
  box-shadow: 0 0 14px rgba(255,150,60,0.3), inset 0 0 12px rgba(255,150,60,0.2);
}
.btn.stop:hover { box-shadow: 0 0 22px rgba(255,150,60,0.6), inset 0 0 14px rgba(255,150,60,0.4); }
/* Sirf bolte waqt full dikhao - baaki waqt halka (click karna band) */
body:not([data-state="speaking"]) .btn.stop { opacity: 0.25; pointer-events: none; }
.btn span {
  position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%);
  font-size: 0.62rem; letter-spacing: 0.14em; color: var(--blue); white-space: nowrap; text-transform: uppercase;
}
.cmd {
  display: flex; flex: 0 1 560px; min-width: 200px; height: 52px; margin: 0 8px;
  border: 1px solid var(--line); background: var(--panel);
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
}
.cmd input {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--text);
  font: inherit; font-size: 1.05rem; padding: 0 18px; user-select: text;
}
.cmd input::placeholder { color: rgba(143,227,255,0.4); }
.cmd button {
  border: 0; border-left: 1px solid var(--line); background: rgba(31,169,255,0.12); color: var(--cyan);
  font: inherit; font-weight: 700; letter-spacing: 0.2em; padding: 0 22px; cursor: pointer;
}
.cmd button:hover { background: rgba(31,169,255,0.28); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ---------- Sleep ---------- */
.sleep-msg {
  position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
}
.sleep-msg .ember { width: 12px; height: 12px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 22px 6px var(--glow); animation: breathe 3s ease-in-out infinite; }
.sleep-msg p { margin: 0; font-size: 1.1rem; letter-spacing: 0.3em; color: rgba(143,227,255,0.75); }
@keyframes breathe { 50% { transform: scale(0.5); opacity: 0.35; } }
/* Window chhupi ya JARVIS soya hua: har animation ruki (GPU/CPU ~0). Wake pe class hat jaati hai */
body.idle *, body.idle *::before, body.idle *::after { animation-play-state: paused !important; }
body.sleep .hud { filter: blur(7px) brightness(0.45); opacity: 0.45; }
body.sleep .sleep-msg { opacity: 1; }

/* ---------- Wake: flash + slide-in ---------- */
.flash { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 50% 45%, rgba(143,227,255,0.95), rgba(31,169,255,0.5) 40%, transparent 75%); }
body.waking .flash { animation: flash 0.8s ease-out; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
.col-left, .col-right, .dock, .topbar, .center { transition: transform 0.8s cubic-bezier(.2,.9,.25,1.1), opacity 0.7s ease; }
body.sleep .col-left { transform: translateX(-60px); opacity: 0; }
body.sleep .col-right { transform: translateX(60px); opacity: 0; }
body.sleep .dock { transform: translateY(60px); opacity: 0; }
body.sleep .topbar { transform: translateY(-30px); opacity: 0.4; }
body.sleep .center { transform: scale(0.94); }

/* ---------- Chhoti screen: side columns chhupao ---------- */
@media (max-width: 1000px) {
  .hud { grid-template-columns: 1fr; grid-template-areas: "top" "center" "dock"; grid-template-rows: 56px 1fr auto; }
  .col-left, .col-right { display: none; }
  .dial { width: min(50vh, 84vw); }
  .ruler, .online { display: none; }
  .brand { font-size: 1.3rem; }
  .dock { flex-wrap: wrap; gap: 10px; }
  .cmd { order: -1; flex-basis: 100%; margin: 0; }
  .dock-btns { gap: 10px; }
  .btn { width: 46px; height: 46px; }
  .btn span { display: none; }
}

/* Sirf browser preview (#preview) ke screenshot ke liye - transitions turant */
body.snap, body.snap * { transition: none !important; }

/* ---------- Kam motion chahiye ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; transition-duration: 0.001s !important; }
}
</style>
</head>
<body class="sleep" data-state="sleeping">
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<main class="hud">
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="brand">J.A.R.V.I.S</div>
    <div class="pill" role="status"><span class="dot"></span><span id="pillText">Sleeping</span></div>
    <div class="ruler" aria-hidden="true"></div>
    <div class="online">SYSTEM <b>ONLINE</b></div>
  </header>

  <!-- ===== Left column ===== -->
  <section class="col-left">
    <div class="panel">
      <h3>Chronometer</h3>
      <div class="clock-wrap">
        <svg class="date-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(31,169,255,0.15)" stroke-width="5"/>
          <circle id="monthArc" cx="50" cy="50" r="44" fill="none" stroke="#1fa9ff" stroke-width="5"
                  stroke-linecap="round" transform="rotate(-90 50 50)" style="filter: drop-shadow(0 0 3px #1fa9ff)"/>
          <circle cx="50" cy="50" r="36" fill="none" stroke="rgba(143,227,255,0.25)" stroke-width="1" stroke-dasharray="2 4"/>
          <text id="dayNum" class="num" x="50" y="54" text-anchor="middle">--</text>
          <text id="monName" class="mon" x="50" y="70" text-anchor="middle">---</text>
        </svg>
        <div>
          <div class="time"><span id="hm">--:--</span><small id="ss">--</small></div>
          <div class="fulldate" id="fullDate"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>System <small>LIVE</small></h3>
      <div class="gauges">
        <div class="gauge" data-g="cpu"></div>
        <div class="gauge" data-g="ram"></div>
        <div class="gauge" data-g="bat"></div>
      </div>
      <div class="bars">
        <div class="bar-row"><span>DISK</span><div class="segs" id="diskS"></div><span id="diskV">--%</span></div>
        <div class="bar-row"><span>NET</span><div class="segs" id="netS"></div><span id="netV">-- MB/s</span></div>
      </div>
    </div>

    <div class="panel activity">
      <h3>Activity</h3>
      <ul class="acts" id="acts"><li class="empty">Koi kaam nahi chal raha</li></ul>
    </div>
  </section>

  <!-- ===== Center ===== -->
  <section class="center">
    <div class="dial">
      <svg viewBox="0 0 600 600" aria-hidden="true">
        <defs>
          <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
          <radialGradient id="coreGlow">
            <stop offset="0" stop-color="#1fa9ff" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#1fa9ff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="300" cy="300" r="170" fill="url(#coreGlow)"/>
        <!-- Bahar ki patli rings -->
        <g class="spin r-cw-slow">
          <circle cx="300" cy="300" r="292" fill="none" stroke="rgba(31,169,255,0.35)" stroke-width="1"/>
          <circle cx="300" cy="300" r="286" fill="none" stroke="rgba(143,227,255,0.5)" stroke-width="1.5" stroke-dasharray="120 60 30 60"/>
        </g>
        <!-- 120 ticks (har 10th lamba) - JS se bante hain -->
        <g id="ticks" class="spin r-ccw"></g>
        <!-- Dotted ring -->
        <g class="spin r-cw">
          <circle cx="300" cy="300" r="240" fill="none" stroke="rgba(143,227,255,0.55)" stroke-width="2.5" stroke-dasharray="0.1 9" stroke-linecap="round"/>
        </g>
        <!-- Amber arc -->
        <g class="spin r-ccw-fast">
          <path d="M 300 74 A 226 226 0 0 1 495.7 187" fill="none" stroke="#ffb03a" stroke-width="3" stroke-linecap="round" style="filter: drop-shadow(0 0 5px #ffb03a)"/>
          <path d="M 300 526 A 226 226 0 0 1 150 469" fill="none" stroke="rgba(255,176,58,0.45)" stroke-width="1.5"/>
        </g>
        <!-- Andar moti segmented ring -->
        <g class="spin r-cw">
          <circle cx="300" cy="300" r="204" fill="none" stroke="rgba(31,169,255,0.8)" stroke-width="14" stroke-dasharray="46 8"/>
          <circle cx="300" cy="300" r="204" fill="none" stroke="#8fe3ff" stroke-width="14" stroke-dasharray="46 8" opacity="0.35" filter="url(#soft)"/>
        </g>
        <circle cx="300" cy="300" r="186" fill="none" stroke="rgba(31,169,255,0.3)" stroke-width="1"/>
        <circle cx="300" cy="300" r="122" fill="none" stroke="rgba(143,227,255,0.35)" stroke-width="1"/>
      </svg>
      <canvas id="wave"></canvas>
      <div class="dial-core">
        <div class="name">JARVIS</div>
        <div class="state" id="stateText">Sleeping</div>
      </div>
    </div>
    <div class="caption" id="caption" aria-live="polite"></div>
    <div class="note" id="note"></div>
  </section>

  <!-- ===== Right column ===== -->
  <section class="col-right">
    <div class="panel">
      <h3>Weather</h3>
      <div class="weather">
        <svg viewBox="0 0 110 110" aria-hidden="true">
          <circle cx="55" cy="55" r="48" fill="none" stroke="rgba(31,169,255,0.15)" stroke-width="6"
                  stroke-dasharray="226 302" transform="rotate(135 55 55)"/>
          <circle id="tempArc" cx="55" cy="55" r="48" fill="none" stroke="#1fa9ff" stroke-width="6" stroke-linecap="round"
                  stroke-dasharray="0 302" transform="rotate(135 55 55)" style="filter: drop-shadow(0 0 3px #1fa9ff)"/>
          <text id="wTemp" class="temp" x="55" y="60" text-anchor="middle">--</text>
          <text class="unit" x="55" y="78" text-anchor="middle">°C</text>
        </svg>
        <div>
          <div class="city" id="wCity">No data</div>
          <div class="desc" id="wDesc">"Delhi ka weather" poochiye</div>
          <div class="upd" id="wUpd"></div>
        </div>
      </div>
    </div>
    <div class="panel convo">
      <h3>Conversation</h3>
      <div class="msgs" id="msgs"></div>
    </div>
  </section>

  <!-- ===== Bottom dock ===== -->
  <footer class="dock">
    <div class="dock-btns">
      <button class="btn" data-cmd="Chrome kholo" title="Browser" aria-label="Browser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg><span>Browser</span></button>
      <button class="btn" data-cmd="YouTube kholo" title="YouTube" aria-label="YouTube">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg><span>YouTube</span></button>
      <button class="btn" data-cmd="WhatsApp kholo" title="WhatsApp" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/><path d="M9 9.5c.5 2 2 3.5 4 4"/></svg><span>WhatsApp</span></button>
    </div>
    <div class="cmd">
      <input id="cmdInput" type="text" placeholder="Command likhiye, sir…" autocomplete="off" aria-label="Command">
      <button id="sendBtn">SEND</button>
    </div>
    <div class="dock-btns">
      <button class="btn" data-cmd="Spotify kholo" title="Music" aria-label="Music">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg><span>Music</span></button>
      <button class="btn" data-cmd="File explorer kholo" title="Files" aria-label="Files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Files</span></button>
      <button class="btn" data-cmd="screen pe kya hai" title="Scan screen" aria-label="Scan screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"/><path d="M7 12h10"/></svg><span>Scan</span></button>
      <button class="btn stop" id="stopBtn" title="Bologe bolte roko (ya Esc)" aria-label="Stop speaking">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>Stop</span></button>
    </div>
  </footer>
</main>

<div class="sleep-msg" aria-live="polite"><div class="ember"></div><p>SAY "JARVIS WAKE UP"</p></div>
<div class="flash" aria-hidden="true"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const body = document.body;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const NS = "http://www.w3.org/2000/svg";

  /* ================= STATES ================= */
  // Python ye naam bhejta hai: sleeping / standby / listening / thinking / speaking
  const LABELS = { sleeping: "Sleeping", standby: "Online", listening: "Listening", thinking: "Working", speaking: "Speaking" };
  const ALIAS = { online: "standby", working: "thinking" };
  let state = "sleeping", awake = false;
  function setState(s) {
    s = String(s || "").toLowerCase();
    s = ALIAS[s] || s;
    if (!LABELS[s]) return;
    state = s;
    body.dataset.state = s;
    $("pillText").textContent = LABELS[s];
    $("stateText").textContent = LABELS[s];
  }

  /* ================= DIAL: 120 ticks ================= */
  const ticks = $("ticks");
  for (let i = 0; i < 120; i++) {
    const long = i % 10 === 0;
    const a = (i / 120) * Math.PI * 2;
    const r1 = long ? 252 : 262, r2 = 274;
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 300 + Math.cos(a) * r1); l.setAttribute("y1", 300 + Math.sin(a) * r1);
    l.setAttribute("x2", 300 + Math.cos(a) * r2); l.setAttribute("y2", 300 + Math.sin(a) * r2);
    l.setAttribute("stroke", long ? "#8fe3ff" : "rgba(31,169,255,0.55)");
    l.setAttribute("stroke-width", long ? 2.4 : 1.2);
    if (long) l.style.filter = "drop-shadow(0 0 3px #8fe3ff)";
    ticks.appendChild(l);
  }

  /* ================= DIAL: 96 radial bars (gol waveform) ================= */
  const cv = $("wave"), cx = cv.getContext("2d");
  const BARS = 96;
  let level = 0, extLevel = 0, lastLevelAt = -1e9;
  function sizeCanvas() {
    const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.height * d));
  }
  function drawWave(t) {
    const W = cv.width, c = W / 2, s = W / 600;
    cx.clearRect(0, 0, W, cv.height);
    const inner = 130 * s, maxLen = 52 * s;     // "JARVIS" text se bahar, r=186 ring ke andar
    // Python ka setLevel 0.4s se purana ho gaya to use shaant maano
    const live = (t - lastLevelAt) < 400 ? extLevel : 0;
    let target;
    if (state === "speaking") target = Math.max(live, 0.08);
    else if (state === "listening") target = 0.14;
    else if (state === "thinking") target = 0.4;
    else if (state === "sleeping") target = 0.02;
    else target = 0.06;
    level += (target - level) * 0.33;      // 30 FPS pe 60 FPS jaisi smoothness

    const tt = t / 1000;
    cx.lineWidth = 3 * s;
    cx.lineCap = "round";
    for (let i = 0; i < BARS; i++) {
      const a = (i / BARS) * Math.PI * 2 - Math.PI / 2;
      let n;
      if (state === "thinking") n = 0.2 + 0.8 * Math.max(0, Math.sin(a * 2 - tt * 4));   // ghoomti wave
      else if (state === "listening") n = 0.5 + 0.5 * Math.sin(a * 3 + tt * 2.2);        // halka lehrana
      else n = 0.35 + 0.65 * Math.abs(Math.sin(i * 1.7 + tt * 9) * Math.cos(i * 0.45 - tt * 5));
      const len = Math.max(2 * s, level * maxLen * n + 3 * s);
      cx.strokeStyle = state === "thinking" ? `rgba(255,176,58,${0.45 + n * 0.55})` : `rgba(143,227,255,${0.35 + n * 0.6})`;
      cx.beginPath();
      cx.moveTo(c + Math.cos(a) * inner, c + Math.sin(a) * inner);
      cx.lineTo(c + Math.cos(a) * (inner + len), c + Math.sin(a) * (inner + len));
      cx.stroke();
    }
  }
  // Waveform sirf tab chalta hai jab window dikh rahi ho AUR JARVIS jaaga ho; 30 FPS se zyada nahi
  const FRAME_MS = 1000 / 30;
  let visible = true, rafId = 0, lastDraw = -1e9, clockId = 0;
  function frame(t) {
    rafId = 0;
    if (!(visible && awake)) return;                 // Rukna hai -> agla frame mangte hi nahi
    if (t - lastDraw >= FRAME_MS - 2) { lastDraw = t; drawWave(reduced ? 0 : t); }
    rafId = requestAnimationFrame(frame);
  }
  // Animations aur loops ko halat ke hisaab se chalao/roko
  function applyRunState() {
    const run = visible && awake;
    body.classList.toggle("idle", !visible || !awake);
    if (run && !rafId) rafId = requestAnimationFrame(frame);
    if (!run && rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    if (visible && !clockId) { tickClock(); clockId = setInterval(tickClock, 1000); }
    if (!visible && clockId) { clearInterval(clockId); clockId = 0; }
  }
  function setVisible(v) { visible = !!v; applyRunState(); }

  /* ================= CLOCK ================= */
  const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const monthArc = $("monthArc"), MC = 2 * Math.PI * 44;
  const pad = (n) => String(n).padStart(2, "0");
  function tickClock() {
    const d = new Date();
    $("hm").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    $("ss").textContent = pad(d.getSeconds());
    $("dayNum").textContent = d.getDate();
    $("monName").textContent = MONTHS[d.getMonth()];
    $("fullDate").textContent = d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    const days = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    monthArc.setAttribute("stroke-dasharray", `${MC * d.getDate() / days} ${MC}`);   // mahina kitna beeta
  }

  /* ================= SYSTEM GAUGES ================= */
  const GC = 2 * Math.PI * 34, GARC = GC * 0.75;          // 270° ka arc
  const gauges = {};
  document.querySelectorAll(".gauge").forEach((el) => {
    const key = el.dataset.g;
    const label = { cpu: "CPU", ram: "RAM", bat: "BATTERY" }[key];
    el.innerHTML =
      `<svg viewBox="0 0 90 90" aria-hidden="true"><circle cx="45" cy="45" r="34" fill="none" stroke="rgba(31,169,255,0.15)" stroke-width="7"
        stroke-dasharray="${GARC} ${GC}" transform="rotate(135 45 45)"/>
       <circle class="arc" cx="45" cy="45" r="34" fill="none" stroke="#1fa9ff" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="0 ${GC}" transform="rotate(135 45 45)" style="transition: stroke-dasharray .6s; filter: drop-shadow(0 0 3px #1fa9ff)"/>
       <text class="val" x="45" y="51" text-anchor="middle">--</text></svg><div class="lbl">${label}</div>`;
    gauges[key] = { arc: el.querySelector(".arc"), val: el.querySelector(".val") };
  });
  function setGauge(key, v) {
    const g = gauges[key];
    if (v === null || v === undefined || isNaN(v)) { g.val.textContent = "--"; g.arc.setAttribute("stroke-dasharray", `0 ${GC}`); return; }
    v = Math.max(0, Math.min(100, Number(v)));
    g.val.textContent = Math.round(v) + "%";
    g.arc.setAttribute("stroke-dasharray", `${GARC * v / 100} ${GC}`);
  }
  ["diskS", "netS"].forEach((id) => { for (let i = 0; i < 24; i++) $(id).appendChild(document.createElement("i")); });
  function setSegs(id, frac) {
    const on = Math.round(Math.max(0, Math.min(1, frac)) * 24);
    [...$(id).children].forEach((s, i) => s.classList.toggle("on", i < on));
  }
  function setStats(cpu, ram, battery, disk, net) {
    setGauge("cpu", cpu); setGauge("ram", ram); setGauge("bat", battery);
    if (disk !== undefined && disk !== null) { setSegs("diskS", disk / 100); $("diskV").textContent = Math.round(disk) + "%"; }
    if (net !== undefined && net !== null) {
      net = Number(net);
      setSegs("netS", Math.log10(1 + net * 10) / 2);          // log scale: chhoti speed bhi dikhe
      $("netV").textContent = (net < 10 ? net.toFixed(2) : Math.round(net)) + " MB/s";
    }
  }

  /* ================= WEATHER ================= */
  const TC = 2 * Math.PI * 48, TARC = TC * 0.75;
  function setWeather(city, temp, desc) {
    $("wCity").textContent = city || "--";
    $("wDesc").textContent = desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : "";
    const t = Number(temp);
    $("wTemp").textContent = isNaN(t) ? "--" : Math.round(t);
    const frac = isNaN(t) ? 0 : Math.max(0, Math.min(1, (t + 10) / 60));   // -10°C .. 50°C
    $("tempArc").setAttribute("stroke-dasharray", `${TARC * frac} ${TC}`);
    const d = new Date();
    $("wUpd").textContent = "UPDATED " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  /* ================= ACTIVITY ================= */
  const acts = new Map();
  function action(id, title, detail, status) {
    status = ["running", "done", "failed"].includes(status) ? status : "running";
    const list = $("acts");
    const empty = list.querySelector(".empty"); if (empty) empty.remove();
    let li = acts.get(String(id));
    if (!li) {
      li = document.createElement("li");
      li.innerHTML = '<div class="st"></div><div><div class="t"></div><div class="d"></div></div><div class="tag"></div>';
      list.prepend(li);
      acts.set(String(id), li);
      while (list.children.length > 7) {
        const last = list.lastElementChild;
        acts.forEach((v, k) => { if (v === last) acts.delete(k); });
        last.remove();
      }
    }
    li.className = status;
    li.querySelector(".t").textContent = title || "";
    li.querySelector(".d").textContent = detail || "";
    li.querySelector(".tag").textContent = status.toUpperCase();
  }

  /* ================= LOG (dial ke neeche note line) ================= */
  let noteTimer = null;
  function log(text) {
    $("note").textContent = text || "";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { $("note").textContent = ""; }, 8000);
  }

  /* ================= MESSAGES: bada caption + conversation list ================= */
  const msgs = $("msgs"), caption = $("caption");
  let typeTimer = null;
  function addMessage(who, text) {
    who = who === "user" ? "user" : "ai";
    text = String(text || "");
    // Conversation list
    const el = document.createElement("div");
    el.className = "msg " + who;
    const b = document.createElement("b"); b.textContent = who === "user" ? "KRISH" : "JARVIS";
    const s = document.createElement("span"); s.textContent = text;
    el.append(b, s); msgs.appendChild(el);
    while (msgs.children.length > 80) msgs.firstElementChild.remove();
    msgs.scrollTop = msgs.scrollHeight;
    // Caption: mera bola hua amber quotes mein, JARVIS ka typing effect ke saath
    clearInterval(typeTimer);
    caption.textContent = "";
    if (who === "user") {
      const u = document.createElement("span"); u.className = "user"; u.textContent = "“" + text + "”";
      caption.appendChild(u);
      return;
    }
    const span = document.createElement("span"), cur = document.createElement("span");
    cur.className = "cursor";
    caption.append(span, cur);
    if (reduced) { span.textContent = text; cur.remove(); return; }
    let i = 0;
    typeTimer = setInterval(() => {
      i += 2;
      span.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(typeTimer); setTimeout(() => cur.remove(), 1200); }
    }, 22);
  }

  function setLevel(v) {
    extLevel = Math.max(0, Math.min(1, Number(v) || 0));
    lastLevelAt = performance.now();
  }

  /* ================= SOUND (Web Audio) ================= */
  let ac = null;
  function wakeSound() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const now = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(180, now);
      o.frequency.exponentialRampToValueAtTime(880, now + 0.35);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.12, now + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
      o.connect(g).connect(ac.destination);
      o.start(now); o.stop(now + 0.65);
    } catch (e) { /* awaaz na chale to koi baat nahi */ }
  }

  /* ================= WAKE / SLEEP ================= */
  function wake() {
    if (awake) return;
    awake = true;
    if (!reduced) wakeSound();
    body.classList.remove("sleep");
    applyRunState();
    body.classList.add("waking");
    setTimeout(() => body.classList.remove("waking"), 900);
    setState("listening");
  }
  function sleep() {
    awake = false;
    body.classList.add("sleep");
    setState("sleeping");
    drawWave(0);                                     // Aakhri (shaant) frame; uske baad canvas band
    setTimeout(applyRunState, 900);                  // Sleep transition (0.9s) khatam hone do, phir sab roko
  }

  /* ================= COMMANDS -> Python ================= */
  const hasPy = () => !!(window.pywebview && window.pywebview.api && window.pywebview.api.ask);
  let busy = false;
  async function send(text) {
    text = String(text || "").trim();
    if (!text || busy) return;
    busy = true;
    const before = state;
    addMessage("user", text);
    setState("thinking");
    let reply;
    try {
      if (hasPy()) reply = await window.pywebview.api.ask(text);
      else { await new Promise((r) => setTimeout(r, 900)); reply = "Preview mode, sir. Python backend judne par asli jawab aayega."; }
    } catch (e) {
      reply = "Backend se jawab nahi aaya, sir.";
    }
    if (reply) addMessage("ai", reply);
    // Voice loop ne beech mein state badli ho to wahi rehne do
    if (state === "thinking") setState(before === "sleeping" ? "standby" : before);
    busy = false;
  }
  const input = $("cmdInput");
  $("sendBtn").addEventListener("click", () => { send(input.value); input.value = ""; input.focus(); });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { send(input.value); input.value = ""; } });
  document.querySelectorAll(".btn[data-cmd]").forEach((b) => b.addEventListener("click", () => send(b.dataset.cmd)));

  // STOP button = bologe bolte roko (voice ke bina, click se). Esc ka backup.
  const stopPy = () => { try { const a = window.pywebview && window.pywebview.api; if (a && a.stop) a.stop(); } catch (e) {} };
  $("stopBtn").addEventListener("click", (e) => { e.stopPropagation(); stopPy(); });

  // Esc = bolna roko + window chhupao (Python hide karta hai)
  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && window.pywebview && window.pywebview.api && window.pywebview.api.hide) window.pywebview.api.hide();
  });

  /* ================= Python bridge ================= */
  window.jarvis = { wake, sleep, setState, addMessage, log, setLevel, setStats, setWeather, action, setVisible };

  addEventListener("resize", sizeCanvas);
  sizeCanvas();
  setState("sleeping");
  applyRunState();

  /* ================= Preview (sirf browser mein "#preview" / "#preview-sleep") ================= */
  if (location.hash === "#preview") {
    body.classList.add("snap");
    setTimeout(() => {
      wake();
      setStats(34, 71, 58, 62, 1.8);
      setWeather("Delhi", 31, "partly cloudy");
      action(1, "Checking weather", "Delhi", "done");
      action(2, "Opening YouTube", "youtube.com", "done");
      action(3, "Scanning screen", "vision model", "failed");
      action(4, "Searching web", "India cricket news", "running");
      addMessage("user", "Delhi ka weather kaisa hai");
      addMessage("ai", "Sir, Delhi mein abhi 31 degree hai, partly cloudy. Aaj baarish ka chance 10 percent.");
      addMessage("user", "YouTube kholo");
      addMessage("ai", "YouTube khol raha hoon, sir.");
      setState("speaking");
      log("Voice: ElevenLabs");
      setInterval(() => setLevel(0.3 + Math.random() * 0.7), 60);
    }, 200);
  }
})();
</script>
</body>
